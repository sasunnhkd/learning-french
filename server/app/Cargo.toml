[package]
name = "grammaire-server"
version = "0.1.0"
description = "Rust port of the grammaire backoffice JSON API (see docs/migration/)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "grammaire-server"
path = "src/main.rs"

# Every crate here was vetted before it was added (MIGRATION_PLAN.md, Phase 2).
# Exact pins; Cargo.lock pins the transitive tree. Re-run scripts/osv-audit.py
# after any change.
[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "form", "query", "tokio", "matched-path", "original-uri", "tracing"] }
dotenvy = "=0.15.7"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["trace", "request-id", "timeout"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "json", "ansi", "std"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }
