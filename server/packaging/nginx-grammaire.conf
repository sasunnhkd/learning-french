# nginx site for the grammaire backoffice API on Debian 12.
# /etc/nginx/sites-available/grammaire-api, linked into sites-enabled.
# Placeholders: api.example.com and the certificate paths (certbot).
# Phase 5 audit: F3 (login limit per client, X-Real-IP) and F8 (headers,
# timeouts, /up not public).

# 5 login requests per minute per client, a burst of 5, then 429. The app
# has its own limit (LOGIN_RATE_LIMIT), which answers in Laravel's JSON.
# CORS preflights (OPTIONS, sent before every cross-origin login) get an
# empty key, which nginx doesn't count: otherwise they would use up half the
# limit, and nginx's 429 has no CORS headers, so the browser would report a
# CORS error instead.
map $request_method $grammaire_login_key {
    OPTIONS "";
    default $binary_remote_addr;
}
limit_req_zone $grammaire_login_key zone=grammaire_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    # Debian 12 ships nginx 1.22: HTTP/2 is a `listen` parameter there
    # (the separate `http2 on;` needs 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # The app's own post limit is 8 MB (Laravel's post_max_size).
    client_max_body_size 8m;
    # Slow-client limits (F8): axum has no header-read timeout of its own.
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The app keys its login limit on X-Real-IP from loopback (F3).
    proxy_set_header X-Real-IP $remote_addr;
    # Echoed and logged by the app (it keeps only [A-Za-z0-9._-]{1,64}).
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 35s;

    # Health check: for the host only (F8).
    location = /up {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/auth/login {
        limit_req zone=grammaire_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # Nothing else is served here (the site itself is on GitHub Pages).
    location / {
        return 404;
    }
}
